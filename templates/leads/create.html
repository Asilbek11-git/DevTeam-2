{% extends 'base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <a href="{% url 'lead-list' %}" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1.5 font-medium mb-1">
                <i class="fa-solid fa-arrow-left"></i> Back to Pipeline
            </a>
            <h1 class="text-2xl font-bold text-white tracking-tight">Create Deal / Lead</h1>
        </div>
    </div>

    <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-6 sm:p-8 shadow-sm">
        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <!-- Title -->
                <div class="space-y-1.5 sm:col-span-2">
                    <label class="text-xs font-semibold text-slate-300">Opportunity / Deal Title *</label>
                    <input type="text" name="title" required placeholder="e.g. Next.js SaaS MVP & Stripe Billing Integration"
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Existing Client (Optional) -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300">Existing Client (Optional)</label>
                    <select name="client_id" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="">-- Create for new prospective contact --</option>
                        {% for c in clients %}
                        <option value="{{ c.id }}" {% if selected_client_id == c.id|stringformat:"s" %}selected{% endif %}>{{ c.full_name }} ({{ c.company|default:c.email }})</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Service Template -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300">Linked Service Offering</label>
                    <select name="service_id" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="">-- Custom Scope --</option>
                        {% for s in services %}
                        <option value="{{ s.id }}">{{ s.name }} (${{ s.base_price|floatformat:0 }})</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Contact Name (if not existing client) -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300">Contact Person Name</label>
                    <input type="text" name="contact_name" placeholder="Johnathan Doe"
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Contact Email -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300">Contact Email</label>
                    <input type="email" name="contact_email" placeholder="john@enterprise.io"
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Contact Phone -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300">Contact Phone / Telegram</label>
                    <input type="text" name="contact_phone" placeholder="+1 (555) 012-3456 / @johndoe"
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Source -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300">Acquisition Source</label>
                    <select name="source" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                        {% for code, label in source_choices %}
                        <option value="{{ code }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Budget -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300">Target Budget ($ USD) *</label>
                    <input type="number" step="0.01" name="budget" required value="5000.00"
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 font-mono focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Win Probability -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300">Win Probability (0 - 100%)</label>
                    <input type="number" min="0" max="100" name="probability" value="60"
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 font-mono focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Initial Stage -->
                <div class="space-y-1.5 sm:col-span-2">
                    <label class="text-xs font-semibold text-slate-300">Initial Pipeline Stage</label>
                    <select name="status" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                        {% for code, label in status_choices %}
                        <option value="{{ code }}" {% if code == 'NEW' %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Description -->
            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-slate-300">Scope, Requirements & Technical Discussion Notes</label>
                <textarea name="description" rows="5" placeholder="Project deliverables, architecture stack, client timeline expectations, milestones..."
                          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500"></textarea>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800">
                <a href="{% url 'lead-list' %}" class="px-5 py-2.5 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-semibold transition">Cancel</a>
                <button type="submit" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold transition shadow-sm">
                    Create Deal Lead
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
