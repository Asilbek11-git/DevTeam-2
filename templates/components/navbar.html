<!-- Top Navigation Header Bar -->
<header class="h-16 bg-slate-950/80 backdrop-blur border-b border-slate-800/80 px-6 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-4">
        <h1 class="text-lg font-bold text-white tracking-tight">{{ page_title|default:"Dashboard" }}</h1>
        <div class="hidden sm:flex items-center text-xs font-mono bg-slate-900 border border-slate-800 rounded-full px-2.5 py-1 text-slate-400 gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>Sprint 24 Active</span>
        </div>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center gap-3">
        <!-- Quick Search -->
        <div class="relative hidden md:block">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="text" placeholder="Search tasks, sprints, commits..." class="bg-slate-900 border border-slate-800 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-200 placeholder-slate-400 focus:outline-none focus:border-indigo-500 w-64 transition-all" />
        </div>

        <!-- API Docs Link -->
        <a href="/api/docs/" target="_blank" class="hidden sm:inline-flex items-center gap-1.5 text-xs text-slate-300 hover:text-white bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1.5 hover:bg-slate-800 transition">
            <i class="fa-solid fa-book-bookmark text-indigo-400"></i>
            <span>Swagger API</span>
        </a>

        <!-- Notifications -->
        <div class="relative">
            <button class="w-8 h-8 rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-800 transition relative">
                <i class="fa-regular fa-bell text-xs"></i>
                {% if unread_notifications_count > 0 %}
                <span class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-rose-500 text-white text-[9px] font-bold flex items-center justify-center border-2 border-slate-950">
                    {{ unread_notifications_count }}
                </span>
                {% endif %}
            </button>
        </div>

        <!-- Quick Action Trigger -->
        <a href="{% url 'kanban-board' %}" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow-md shadow-indigo-600/20 transition-all">
            <i class="fa-solid fa-plus"></i>
            <span>New Task</span>
        </a>

        <!-- Log Out Button -->
        <a href="{% url 'logout' %}" title="Log out of account" class="flex items-center gap-1.5 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-300 hover:text-rose-200 text-xs font-medium px-2.5 py-1.5 rounded-lg transition-colors">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span class="hidden sm:inline">Logout</span>
        </a>
    </div>
</header>
