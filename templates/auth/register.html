{% extends 'base.html' %}

{% block public_content %}
<div class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6">
        <!-- Logo -->
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold mx-auto shadow-lg shadow-indigo-500/25">
                <i class="fa-solid fa-cube text-xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-white tracking-tight">Create DevTeam Workspace</h2>
            <p class="text-xs text-slate-400">Launch your multi-tenant developer project management hub</p>
        </div>

        <!-- Flash Messages -->
        {% if messages %}
        <div class="space-y-2">
            {% for message in messages %}
            <div class="p-3 rounded-lg border text-xs bg-rose-950/50 border-rose-800 text-rose-200">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <!-- Register Form -->
        <form method="POST" action="{% url 'register' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Workspace Name</label>
                <div class="relative">
                    <i class="fa-solid fa-building absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="text" name="workspace_name" required placeholder="Acme Engineering" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500" />
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Full Name / Username</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="text" name="username" required placeholder="alexmercer" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500" />
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Work Email Address</label>
                <div class="relative">
                    <i class="fa-regular fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="email" name="email" required placeholder="alex@acme.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500" />
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="password" name="password" required minlength="8" placeholder="Minimum 8 characters" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500" />
                </div>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-600/30 text-sm transition-all">
                Create Workspace & Account
            </button>
        </form>

        <div class="text-center text-xs text-slate-400">
            Already have an account? <a href="{% url 'login' %}" class="text-indigo-400 hover:text-indigo-300 font-semibold">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
