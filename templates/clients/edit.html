{% extends 'base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <a href="{% url 'client-detail' client.id %}" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1.5 font-medium mb-1">
                <i class="fa-solid fa-arrow-left"></i> Back to Client Profile
            </a>
            <h1 class="text-2xl font-bold text-white tracking-tight">Edit Client: {{ client.full_name }}</h1>
        </div>
    </div>

    <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-6 sm:p-8 shadow-sm">
        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <!-- Full Name -->
                <div class="space-y-1.5 sm:col-span-2">
                    <label class="text-xs font-semibold text-slate-300">Client Full Name *</label>
                    <input type="text" name="full_name" required value="{{ client.full_name }}"
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Company -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300">Company / Organization</label>
                    <input type="text" name="company" value="{{ client.company }}"
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Email -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300">Primary Email *</label>
                    <input type="email" name="email" required value="{{ client.email }}"
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Phone -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300">Phone Number</label>
                    <input type="text" name="phone" value="{{ client.phone }}"
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Website -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300">Website URL</label>
                    <input type="url" name="website" value="{{ client.website }}"
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Status -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300">Status</label>
                    <select name="status" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                        {% for code, label in status_choices %}
                        <option value="{{ code }}" {% if client.status == code %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Rating -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300">Client Rating</label>
                    <select name="rating" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="5" {% if client.rating == 5 %}selected{% endif %}>⭐⭐⭐⭐⭐ (5 - Premier Client)</option>
                        <option value="4" {% if client.rating == 4 %}selected{% endif %}>⭐⭐⭐⭐ (4 - High Value)</option>
                        <option value="3" {% if client.rating == 3 %}selected{% endif %}>⭐⭐⭐ (3 - Standard)</option>
                        <option value="2" {% if client.rating == 2 %}selected{% endif %}>⭐⭐ (2 - Low Volume)</option>
                        <option value="1" {% if client.rating == 1 %}selected{% endif %}>⭐ (1 - At Risk)</option>
                    </select>
                </div>
            </div>

            <!-- Notes -->
            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-slate-300">Internal Client Notes & Context</label>
                <textarea name="notes" rows="4"
                          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">{{ client.notes }}</textarea>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800">
                <a href="{% url 'client-detail' client.id %}" class="px-5 py-2.5 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-semibold transition">Cancel</a>
                <button type="submit" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold transition shadow-sm">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
