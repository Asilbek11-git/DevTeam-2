{% extends "base.html" %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4">
    <div class="max-w-md w-full text-center bg-slate-900/60 border border-slate-800 rounded-2xl p-8 backdrop-blur-sm shadow-xl shadow-purple-500/5">
        <div class="w-16 h-16 rounded-2xl bg-purple-500/10 border border-purple-500/20 text-purple-400 flex items-center justify-center mx-auto mb-6">
            <i data-lucide="{{ error_icon|default:'alert-triangle' }}" class="w-8 h-8"></i>
        </div>
        <h1 class="text-4xl font-extrabold text-white tracking-tight mb-2">{{ error_code|default:'404' }}</h1>
        <h2 class="text-lg font-semibold text-slate-200 mb-3">{{ error_title|default:'Page Not Found' }}</h2>
        <p class="text-sm text-slate-400 mb-8 leading-relaxed">
            {{ error_message|default:'The requested resource could not be found or you do not have permission to view it.' }}
        </p>
        <div class="flex items-center justify-center gap-3">
            <a href="{% url 'dashboard' %}" class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-sm font-medium transition shadow-lg shadow-purple-500/20">
                <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Return to Dashboard
            </a>
            <a href="{% url 'home' %}" class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium border border-slate-700 transition">
                <i data-lucide="home" class="w-4 h-4"></i> Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
