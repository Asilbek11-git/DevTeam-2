{% extends 'base.html' %}

{% block content %}
<div class="space-y-6 max-w-4xl mx-auto">
    <div>
        <h2 class="text-xl font-bold text-white tracking-tight">Workspace & Enterprise Settings</h2>
        <p class="text-xs text-slate-400">Configure tenant custom domains, branding, webhook tokens, and audit policies</p>
    </div>

    <!-- Workspace Branding -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 space-y-4">
        <h3 class="text-sm font-bold text-white uppercase tracking-wider">General Profile & Identity</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Workspace Name</label>
                <input type="text" value="{{ current_workspace.name|default:'Main Engineering' }}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-indigo-500" />
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Custom Domain</label>
                <input type="text" placeholder="tasks.yourdomain.com" value="{{ current_workspace.custom_domain|default:'' }}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-indigo-500" />
            </div>
        </div>
        <button class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-xl transition">Save Changes</button>
    </div>

    <!-- API Keys & Webhooks -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 space-y-4">
        <h3 class="text-sm font-bold text-white uppercase tracking-wider">API Access Tokens</h3>
        <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">Active Workspace REST Token</label>
            <div class="flex items-center gap-3">
                <input type="password" readonly value="devteam_sec_live_9941a8e2b810ff4" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs font-mono text-slate-300" />
                <button class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-3 py-2 rounded-xl shrink-0 transition">Copy</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
